
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - PadhaiNexa</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f0f4ff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .register-container {
            background: white;
            width: 100%;
            max-width: 430px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #2455d6;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 16px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #2455d6;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #2455d6;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #163da8;
        }

        button:disabled {
            background: #888;
            cursor: not-allowed;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            line-height: 1.5;
        }

        .links {
            text-align: center;
            margin-top: 20px;
        }

        a {
            color: #2455d6;
            text-decoration: none;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <div class="register-container">

        <h1>PadhaiNexa</h1>
        <p class="subtitle">Create Your Student Account</p>

        <form id="registerForm">

            <label for="name">Full Name</label>
            <input
                type="text"
                id="name"
                placeholder="Enter your full name"
                required
            >

            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <label for="mobile">Mobile Number</label>
            <input
                type="tel"
                id="mobile"
                placeholder="Enter 10-digit mobile number"
                pattern="[0-9]{10}"
                maxlength="10"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                placeholder="Create a password"
                minlength="8"
                required
            >

            <label for="confirmPassword">Confirm Password</label>
            <input
                type="password"
                id="confirmPassword"
                placeholder="Enter password again"
                minlength="8"
                required
            >

            <button type="submit" id="registerButton">
                Create Account
            </button>

            <p id="message" role="status" aria-live="polite"></p>

        </form>

        <div class="links">
            <p>Already have an account? <a href="login.html">Login</a></p>
        </div>

        <a class="back" href="index.html">← Back to Home</a>

    </div>

    <script>
        const registerForm = document.getElementById("registerForm");
        const message = document.getElementById("message");
        const registerButton = document.getElementById("registerButton");

        registerForm.addEventListener("submit", async function(event) {
            event.preventDefault();

            const name = document.getElementById("name").value.trim();
            const email = document.getElementById("email").value.trim();
            const mobile = document.getElementById("mobile").value.trim();
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirmPassword").value;

            message.textContent = "";
            message.style.color = "red";

            if (password !== confirmPassword) {
                message.textContent = "Passwords do not match!";
                return;
            }

            registerButton.disabled = true;
            registerButton.textContent = "Please wait...";

            try {
                const response = await fetch("http://localhost:5000/api/register", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        name: name,
                        email: email,
                        mobile: mobile,
                        password: password
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || "Registration failed!");
                }

                message.style.color = "green";
                message.textContent = data.message + " You can now login.";

                registerForm.reset();

            } catch (error) {
                message.style.color = "red";
                message.textContent = error.message === "Failed to fetch"
                    ? "Server connection failed. Please check if backend is running."
                    : error.message;

            } finally {
                registerButton.disabled = false;
                registerButton.textContent = "Create Account";
            }
        });
    </script>

</body>
</html>
