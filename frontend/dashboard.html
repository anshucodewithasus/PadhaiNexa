
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard - PadhaiNexa</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f3f5fa;
            color: #263238;
        }

        .layout {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 250px;
            flex-shrink: 0;
            background: #14213d;
            color: white;
            padding: 25px 15px;
        }

        .logo {
            color: #fca311;
            font-size: 23px;
            font-weight: bold;
            margin: 5px 10px 35px;
        }

        .sidebar a {
            display: block;
            color: #e8edf5;
            text-decoration: none;
            padding: 14px 15px;
            margin-bottom: 8px;
            border-radius: 7px;
        }

        .sidebar a:hover,
        .sidebar a.active {
            background: #fca311;
            color: #14213d;
        }

        .main {
            flex: 1;
            min-width: 0;
        }

        .topbar {
            background: white;
            padding: 22px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            box-shadow: 0 2px 8px #00000010;
        }

        .topbar h2 {
            font-size: 22px;
        }

        .logout {
            background: #dc3545;
            color: white;
            border: none;
            padding: 11px 18px;
            border-radius: 6px;
            cursor: pointer;
        }

        .content {
            padding: 30px;
        }

        .welcome {
            margin-bottom: 25px;
        }

        .welcome h1 {
            font-size: 27px;
            margin-bottom: 8px;
        }

        .welcome p {
            color: #657080;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card, .profile, .courses-section {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 12px #0000000d;
        }

        .card h3 {
            color: #526071;
            font-size: 16px;
            margin-bottom: 15px;
        }

        .card p {
            font-size: 25px;
            font-weight: bold;
            color: #14213d;
        }

        .profile {
            margin-bottom: 30px;
        }

        .profile h2, .courses-section h2 {
            margin-bottom: 20px;
            color: #14213d;
        }

        .profile p {
            margin: 15px 0;
            color: #4c5665;
            overflow-wrap: anywhere;
        }

        .profile strong {
            display: inline-block;
            width: 100px;
            color: #14213d;
        }

        .course-item {
            border: 1px solid #e2e6ef;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 12px;
        }

        .course-item h3 {
            color: #14213d;
            margin-bottom: 8px;
        }

        .course-item p {
            color: #657080;
            margin-bottom: 8px;
            line-height: 1.5;
        }

        .course-price {
            color: #16803c;
            font-weight: bold;
        }

        .empty-message {
            color: #657080;
            line-height: 1.6;
        }

        @media (max-width: 700px) {
            .layout {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
            }

            .sidebar a {
                display: inline-block;
                padding: 10px;
            }

            .logo {
                margin-bottom: 20px;
            }

            .topbar {
                padding: 18px;
            }

            .content {
                padding: 18px;
            }
        }
    </style>
</head>

<body>

<div class="layout">

    <aside class="sidebar">
        <div class="logo">PadhaiNexa</div>

        <a href="dashboard.html" class="active">🏠 Dashboard</a>
        <a href="courses.html">📚 My Courses</a>
        <a href="#" onclick="showMessage('My PDFs')">📄 My PDFs</a>
        <a href="#" onclick="showMessage('My Classes')">🎥 My Classes</a>
        <a href="#" onclick="showMessage('Account Settings')">⚙️ Settings</a>
        <a href="index.html">🌐 Visit Website</a>
    </aside>

    <main class="main">

        <header class="topbar">
            <h2>Student Dashboard</h2>
            <button class="logout" id="logoutButton">Logout</button>
        </header>

        <section class="content" id="dashboardContent" hidden>

            <div class="welcome">
                <h1 id="studentWelcome">Welcome!</h1>
                <p>Welcome to your PadhaiNexa learning dashboard.</p>
            </div>

            <div class="cards">

                <div class="card">
                    <h3>My Courses</h3>
                    <p id="courseCount">0</p>
                </div>

                <div class="card">
                    <h3>My PDFs</h3>
                    <p>0</p>
                </div>

                <div class="card">
                    <h3>My Classes</h3>
                    <p>0</p>
                </div>

            </div>

            <div class="profile">
                <h2>My Profile</h2>

                <p><strong>Name:</strong>
                    <span id="studentName"></span>
                </p>

                <p><strong>Email:</strong>
                    <span id="studentEmail"></span>
                </p>

                <p><strong>Mobile:</strong>
                    <span id="studentMobile"></span>
                </p>
            </div>

            <div class="courses-section">
                <h2>My Purchased Courses</h2>
                <div id="myCoursesList">
                    <p class="empty-message">Loading courses...</p>
                </div>
            </div>

        </section>

    </main>

</div>

<script>
    async function loadDashboard() {
        try {
            const response = await fetch(
                "https://padhainexa.onrender.com/api/me",
                {
                    method: "GET",
                    credentials: "include"
                }
            );

            const data = await response.json();

            if (!response.ok || !data.success || !data.student) {
                window.location.href = "login.html";
                return;
            }

            const student = data.student;

            document.getElementById("studentWelcome").textContent =
                "Welcome, " + student.name + "!";

            document.getElementById("studentName").textContent =
                student.name || "Not available";

            document.getElementById("studentEmail").textContent =
                student.email || "Not available";

            document.getElementById("studentMobile").textContent =
                student.mobile || "Not available";

            document.getElementById("dashboardContent").hidden = false;

            await loadMyCourses();

        } catch (error) {
            console.error("Dashboard error:", error);
            alert("Server connection failed. Please try again.");
        }
    }

    async function loadMyCourses() {
        const list = document.getElementById("myCoursesList");

        try {
            const response = await fetch(
                "https://padhainexa.onrender.com/api/my-courses",
                {
                    method: "GET",
                    credentials: "include"
                }
            );

            const data = await response.json();

            if (!response.ok || !data.success) {
                throw new Error(data.message || "Unable to load courses.");
            }

            const courses = data.courses || [];

            document.getElementById("courseCount").textContent =
                courses.length;

            if (courses.length === 0) {
                list.innerHTML =
                    '<p class="empty-message">You have not purchased any courses yet. Explore our courses to start learning.</p>';
                return;
            }

            list.replaceChildren();

            courses.forEach(course => {
                const item = document.createElement("div");
                item.className = "course-item";

                const title = document.createElement("h3");
                title.textContent = course.title;

                const description = document.createElement("p");
                description.textContent = course.description || "";

                const price = document.createElement("p");
                price.className = "course-price";
                price.textContent = "₹" + course.price;

                item.append(title, description, price);
                list.appendChild(item);
            });

        } catch (error) {
            console.error("My Courses error:", error);
            list.textContent = "Unable to load your courses. Please try again.";
        }
    }

    async function logoutStudent() {
        try {
            const response = await fetch(
                "https://padhainexa.onrender.com/api/logout",
                {
                    method: "POST",
                    credentials: "include"
                }
            );

            const data = await response.json();

            if (response.ok && data.success) {
                window.location.href = "login.html";
            } else {
                alert("Logout failed. Please try again.");
            }

        } catch (error) {
            alert("Server connection failed.");
        }
    }

    function showMessage(section) {
        alert(section + " feature will be added in the next steps.");
    }

    document.getElementById("logoutButton")
        .addEventListener("click", logoutStudent);

    loadDashboard();
</script>

</body>
</html>
